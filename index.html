<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>classkoytay</title>
  <meta name="description" content="RUET class routine, attendance marks, class tests, lab tests, syllabus, faculty and lab report covers — in your pocket." />
  <meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,600&family=Tinos:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"></div>

  <header class="topbar" id="topbar">
    <div class="topbar-row">
      <div class="brand" data-act="sem-sheet" role="button" tabindex="0" aria-label="Switch semester" style="cursor:pointer">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 64 64"><defs><linearGradient id="ckg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3554e0"/><stop offset="1" stop-color="#1a2a86"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#ckg)"/><path d="M38.16 15.09A18 18 0 1 1 25.84 15.09" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M24 32.5l5.5 5.5L40.5 27" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="25.84" cy="15.09" r="3.3" fill="#35d0a5"/></svg></span>
        <div>
          <div class="brand-name">classkoytay</div>
          <div class="brand-sub"><span id="semLabel">RUET</span><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></div>
        </div>
      </div>
      <button class="week-chip" id="weekChip" data-act="week-sheet" aria-label="Change running week">
        <span class="week-dot"></span><span id="weekText">Week –</span>
      </button>
      <button class="icon-btn" data-act="go" data-to="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.800.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      </button>
    </div>
    <div class="absent-strip first" id="absentStrip" aria-label="Absences by course"></div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar">
    <button data-act="go" data-to="today"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg><span>Today</span></button>
    <button data-act="go" data-to="routine"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4M7.5 13h3M13.5 13h3M7.5 17h3"/></svg><span>Routine</span></button>
    <button data-act="go" data-to="attendance"><svg viewBox="0 0 24 24"><path d="M12 21a9 9 0 1 1 9-9"/><path d="m8 12 3 3 7-7"/><path d="M17 17h4M19 15v4"/></svg><span>Attend</span></button>
    <button data-act="go" data-to="ct"><svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg><span>Tests</span></button>
    <button data-act="go" data-to="more"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg><span>More</span></button>
    <i class="tab-ink" id="tabInk"></i>
  </nav>

  <div class="sheet-wrap" id="sheetWrap" aria-hidden="true">
    <div class="sheet-backdrop" data-act="close-sheet"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
  <script src="js/syllabus.js" defer></script>
  <script src="js/presets.js" defer></script>
  <script src="js/faculty.js" defer></script>
  <script src="js/bridge.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
