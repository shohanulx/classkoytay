name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build web app + sync Android project
        run: |
          node scripts/build-web.mjs
          node node_modules/@capacitor/cli/bin/capacitor sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build signed release APK
        env:
          CK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASS || secrets.KEYSTORE_PASSWORD }}
          CK_VERSION_CODE: ${{ github.run_number }}
          CK_VERSION_NAME: 1.${{ github.run_number }}
        run: |
          # The signing key is committed only in AES-256 encrypted form (android/release.jks.enc).
          # The single repository secret KEYSTORE_PASS (24 chars) decrypts it and unlocks it.
          export CK_KEYSTORE_PASSWORD="$(printf '%s' "$CK_KEYSTORE_PASSWORD" | tr -d ' \r\n\t')"
          echo "Password secret length: ${#CK_KEYSTORE_PASSWORD} (expected 24)"
          if [ -z "$CK_KEYSTORE_PASSWORD" ]; then echo "::error::Add the KEYSTORE_PASS repository secret"; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/release.jks.enc -out "$RUNNER_TEMP/release.jks" -pass env:CK_KEYSTORE_PASSWORD \
            || { echo "::error::KEYSTORE_PASS is wrong — could not decrypt the signing key"; exit 1; }
          export CK_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          # Print the key fingerprint (public) — must match the SHA-1 registered in Firebase for Google login
          keytool -list -v -keystore "$CK_KEYSTORE_FILE" -storepass "$CK_KEYSTORE_PASSWORD" | grep -E "SHA1:" || { echo "::error::Keystore or password secret is wrong"; exit 1; }
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/classkoytay.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: classkoytay-apk
          path: classkoytay.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.${{ github.run_number }}"
          gh release create "$TAG" classkoytay.apk \
            --title "classkoytay $TAG" \
            --notes "Android app for RUET students. Download **classkoytay.apk** on your phone and open it to install (allow 'Install unknown apps' if asked). Built from ${GITHUB_SHA::7}." \
            --latest
